<ion-content [fullscreen]="true">
  <app-toolbar></app-toolbar>
  <ion-grid class="ion-align-items-center ion-justify-content-center">
    <h1>Foto dos documentos</h1>
    <p>Posicione os documentos solicitados, um de cada vez, na base traseira
      para tirar a foto. <br />Clique no documento para abrir a câmera.</p>
    <ion-row *ngFor="let documento of documentos">
      <ion-col size="12">
        <ion-card (click)="openCamera(documento, documento.descricao)">
          <ion-item lines="none">
            <!-- <ion-img src="../../../assets/document-upload/crlv.png"></ion-img> -->
            <ion-label>{{documento.descricao}}</ion-label>
            <ion-icon name="checkmark-circle" color="success"
              *ngIf="documento.check" slot="end" size="large"></ion-icon>
            <ion-spinner name="bubbles" slot="end" *ngIf="documento.isUploading"
              size="large"></ion-spinner>
          </ion-item>
        </ion-card>
      </ion-col>
    </ion-row>
    <ion-row>
      <div class="container-btn">
        <ion-button fill="outline"
          [routerLink]="['/foto-facial']">Voltar</ion-button>
        <ion-button (click)="save()" class="btn-enviar">Enviar</ion-button>
      </div>
    </ion-row>
    <div class="loading" *ngIf="loading">
      <div class="lds-roller">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
  </ion-grid>
</ion-content>
