<ion-content [fullscreen]="true" class="ion-align-items-center">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button (click)="openMenu()"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-grid>
    <ion-row class="ion-align-items-center ion-justify-content-center row-center">
      <ion-col size-lg="6" class="ion-align-items-end ion-justify-content-center" style="display: flex">
        <ion-img src="../../../assets/home/reboque.png"></ion-img>
      </ion-col>
      <ion-col size-lg="6" class="ion-align-items-center ion-justify-content-center col-center" style="display: flex; flex: 2">
        <h1 class="ion-text-center">Seja Bem-vindo</h1>
        <p class="ion-text-center">Escolha a opção desejada abaixo</p>
        <ion-button (click)="goPublicSearch()" class="btn-busca">Iniciar Auto Atendimento</ion-button>
        <ion-button (click)="goQuery()" class="btn-busca" color="warning">Pagamento</ion-button>        
        <ion-button [routerLink]="['/protocol']" class="btn-busca btn-consulta">Atendimento no Guichê</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
  <div class="custom-modal" *ngIf="modalPairingCode">
    <div class="modal-content">
      <h2>Digite o Código de Pareamento</h2>
      <ion-item>
        <ion-label position="floating">Pairing Code</ion-label>
        <ion-input [(ngModel)]="pairingCode" type="text" placeholder="Ex.: DRZOCD0ZR" (ionInput)="onInputChange($event)"></ion-input>
      </ion-item>
      <ion-button expand="block" (click)="confirmPairingCode()" [disabled]="!pairingCode">Confirmar</ion-button>
    </div>
  </div>
</ion-content>
