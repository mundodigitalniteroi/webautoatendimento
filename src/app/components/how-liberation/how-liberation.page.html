<ion-content [fullscreen]="true" class="ion-align-items-center">
  <app-toolbar></app-toolbar>
  <div class="row-center">
    <section id="car-image">
      <ion-img
        src="../../../assets/how-liberation/cars.png"></ion-img>
    </section>
    <section class="selection">
      <h1 class="ion-text-center">
        Como deseja liberar <br />
        o veículo?
      </h1>
      <p class="ion-text-center">
        Por favor, selecione a forma pela qual<br />
        você deseja retirar o veículo
      </p>
      <div class="options" size="12">
        <section (click)="changeSelection('proprietario')">
          <section
            class="check ion-justify-content-end"
            *ngIf="selection && optionSelected == 'proprietario'">
            <ion-img
              src="../../../assets/how-liberation/check.png"></ion-img>
          </section>
          <div
            style="
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                  ">
            <ion-img
              src="../../../assets/how-liberation/chave.png"></ion-img>
            <p class="ion-text-center">Proprietário</p>
          </div>
        </section>
        <section (click)="changeSelection('procurador')">
          <section
            class="check ion-justify-content-end"
            *ngIf="selection && optionSelected == 'procurador'">
            <ion-img
              src="../../../assets/how-liberation/check.png"></ion-img>
          </section>
          <div
            style="
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                  ">
            <ion-img
              src="../../../assets/how-liberation/procurador.png"></ion-img>
            <p class="ion-text-center">Procurador</p>
          </div>

        </section>
      </div>
      <ion-button
        class="next"
        [disabled]="!selection"
        (click)="saveContact()">Continuar</ion-button>
      <ion-button fill="outline"
        [routerLink]="['/process-informations']">Voltar</ion-button>
    </section>
  </div>
</ion-content>
