<ion-content [fullscreen]="true" class="payment-success-page">
  <app-toolbar></app-toolbar>

  <div class="success-container">
    <div class="success-icon-wrapper">
      <div class="success-circle"></div>
      <ion-img src="../../../../assets/payment-confirmed/check.png" class="check-icon"></ion-img>
    </div>

    <div class="success-content">
      <h1>Pagamento confirmado!</h1>
      <p>Imprima sua guia de liberação para retirar o seu veículo</p>
    </div>

    <div class="buttons-container">
      <ion-button expand="block" class="main-button" (click)="imprimirGuia()">
        <ion-icon name="document-text-outline" slot="start"></ion-icon>
        Imprimir Guia de Liberação
      </ion-button>

      <ion-button expand="block" class="secondary-button" (click)="imprimirComprovante()">
        <ion-icon name="receipt-outline" slot="start"></ion-icon>
        Imprimir Comprovante
      </ion-button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" *ngIf="imprimindo">
    <div class="loading-content">
      <div class="spinner"></div>
      <p>Preparando impressão...</p>
    </div>
  </div>
</ion-content>
